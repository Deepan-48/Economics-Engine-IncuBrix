<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IncuBrix — Simulation UI</title>
  <style>
    :root{--blue:#185FA5;--green:#0F6E56;--red:#A32D2D;--yellow:#92620A;--bg:#F8F9FA;--card:#fff;--border:#DEE2E6;--text:#1A1A2E;--muted:#6C757D;--radius:8px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--blue);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
    header h1{font-size:17px;font-weight:600}
    header a{color:rgba(255,255,255,.8);font-size:12px;text-decoration:none;margin-left:16px}
    .layout{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:20px 28px;max-width:1300px;margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
    .card h2{font-size:13px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
    .field select,.field input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button.run{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
    button.run:hover{background:#145490}
    button.run:disabled{background:var(--muted);cursor:not-allowed}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;text-transform:uppercase}
    .safe{background:#E1F5EE;color:var(--green)}
    .warn_near_cap,.warning{background:#FFF3CD;color:var(--yellow)}
    .blocked_hard_cap,.blocked{background:#FCEBEB;color:var(--red)}
    .completed{background:#E6F1FB;color:var(--blue)}
    .route-card{border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
    .route-card.rec{border-color:var(--blue);background:#F0F6FF}
    .route-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .route-name{font-size:15px;font-weight:600;text-transform:capitalize}
    .cost-row{display:flex;gap:18px;margin-bottom:8px}
    .cost-item .val{font-size:18px;font-weight:600;color:var(--blue)}
    .cost-item .lbl{font-size:10px;color:var(--muted)}
    .explanation{font-size:12px;color:var(--muted);line-height:1.5;border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
    .meta-chip{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--muted);margin-right:4px}
    .empty{text-align:center;padding:48px;color:var(--muted);font-size:14px}
    #loading{display:none;text-align:center;padding:32px}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .info-box{background:#F8F9FA;border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
    .section-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
    .blocked-msg{background:#FCEBEB;border:1px solid #F5C6CB;border-radius:var(--radius);padding:14px;color:var(--red);font-size:13px;margin-bottom:14px}
    .tab-bar{display:flex;gap:2px;background:var(--border);padding:2px;border-radius:var(--radius);margin-bottom:14px;width:fit-content}
    .tab{padding:7px 16px;border-radius:6px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--muted)}
    .tab.active{background:#fff;color:var(--blue);font-weight:500}
    .components-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
    .components-table th{background:#E6F1FB;color:var(--blue);padding:4px 8px;text-align:left}
    .components-table td{padding:4px 8px;border-bottom:1px solid var(--border)}
  </style>
</head>
<body>
<header>
  <h1>IncuBrix — Economics Engine</h1>
  <div>
    <a href="admin_console.html">Admin Console</a>
    <a href="/docs" target="_blank">API Docs ↗</a>
  </div>
</header>

<div class="layout">
  <div>
    <div class="card">
      <h2>Job Request</h2>
      <div class="tab-bar">
        <button class="tab active" onclick="setMode('v1')">v1 API</button>
        <button class="tab" onclick="setMode('v2')">v2 API</button>
      </div>

      <div class="field">
        <label>Use Case</label>
        <select id="use_case">
          <option value="script_to_social_variants">Script → Social Variants</option>
          <option value="article_to_social">Article → Social</option>
          <option value="brand_marketing_post_to_promo">Brand Marketing → Promo</option>
          <option value="blog_product_copy_to_explainer">Blog/Product → Explainer</option>
          <option value="campaign_variant_generation">Campaign Variant Generation</option>
          <option value="short_form_social_video">Short-form Social Video</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field"><label>Duration</label>
          <select id="duration_class">
            <option value="short">Short (~8s)</option>
            <option value="medium">Medium (~20s)</option>
            <option value="long">Long (~45s)</option>
          </select>
        </div>
        <div class="field"><label>Quality</label>
          <select id="quality_bar">
            <option value="acceptable">Acceptable</option>
            <option value="high" selected>High</option>
            <option value="premium">Premium</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field"><label>Latency Mode</label>
          <select id="latency_mode">
            <option value="fastest">Fastest</option>
            <option value="balanced">Balanced</option>
            <option value="async_ok" selected>Async OK</option>
          </select>
        </div>
        <div class="field"><label>Budget Mode</label>
          <select id="budget_mode">
            <option value="cheapest">Cheapest</option>
            <option value="balanced" selected>Balanced</option>
            <option value="premium">Premium</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field"><label>Batch Size</label>
          <input type="number" id="batch_size" value="10" min="1"/>
        </div>
        <div class="field" id="variant_field" style="display:none">
          <label>Variant Count <span style="color:var(--blue)">(v2)</span></label>
          <input type="number" id="variant_count" value="1" min="1"/>
        </div>
      </div>

      <div class="field-row">
        <div class="field"><label>Job Budget Cap (USD)</label>
          <input type="number" id="job_budget_cap" value="25" min="0" step="0.01"/>
        </div>
        <div class="field"><label>Workspace Cap (USD)</label>
          <input type="number" id="workspace_budget_cap" value="500" min="0" step="0.01"/>
        </div>
      </div>

      <div id="margin_fields" style="display:none">
        <div style="border-top:1px solid var(--border);margin:12px 0 10px"></div>
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Margin Simulation (v2)</div>
        <div class="field-row">
          <div class="field"><label>Price to Customer ($)</label>
            <input type="number" id="price_to_customer" placeholder="e.g. 60.00" step="0.01"/>
          </div>
          <div class="field"><label>Target Margin %</label>
            <input type="number" id="target_margin_percent" placeholder="e.g. 40" step="1"/>
          </div>
        </div>
        <div class="field"><label>Markup Mode</label>
          <select id="markup_mode">
            <option value="">None</option>
            <option value="pass_through">Pass-through</option>
            <option value="markup">Markup</option>
            <option value="protected_margin">Protected Margin</option>
          </select>
        </div>
      </div>

      <button class="run" id="runBtn" onclick="runEstimate()">▶ Run Estimate</button>
    </div>

    <div class="card">
      <h2>Quick Presets</h2>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button onclick="loadPreset('cheap')" style="padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:12px;text-align:left">💰 Cheapest — short, acceptable, async, batch=5</button>
        <button onclick="loadPreset('breach')" style="padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:12px;text-align:left">🚫 Budget Breach — long, premium, batch=20, cap=$5</button>
        <button onclick="loadPreset('premium')" style="padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:12px;text-align:left">⭐ Premium — medium, premium, fastest, batch=1</button>
        <button onclick="loadPreset('margin')" style="padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:12px;text-align:left">📊 Margin Sim (v2) — markup, price=$60</button>
      </div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2 id="resultTitle">Result</h2>
      <div id="loading">
        <div class="spinner"></div>
        <div style="color:var(--muted);font-size:13px">Running economics pipeline...</div>
      </div>
      <div id="results">
        <div class="empty">Fill in the form and click Run Estimate.</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "http://localhost:8000";
let mode = "v1";

function setMode(m) {
  mode = m;
  document.querySelectorAll(".tab").forEach((t,i) => t.classList.toggle("active", ["v1","v2"][i] === m));
  document.getElementById("variant_field").style.display = m === "v2" ? "block" : "none";
  document.getElementById("margin_fields").style.display = m === "v2" ? "block" : "none";
  document.getElementById("resultTitle").textContent = m === "v2" ? "Result (v2)" : "Result (v1)";
}

async function runEstimate() {
  const btn = document.getElementById("runBtn");
  btn.disabled = true;
  btn.textContent = "Running...";
  document.getElementById("loading").style.display = "block";
  document.getElementById("results").innerHTML = "";

  const jc  = document.getElementById("job_budget_cap").value;
  const wc  = document.getElementById("workspace_budget_cap").value;
  const mm  = document.getElementById("markup_mode")?.value;
  const ptc = document.getElementById("price_to_customer")?.value;
  const tmp = document.getElementById("target_margin_percent")?.value;

  const payload = {
    use_case:       document.getElementById("use_case").value,
    duration_class: document.getElementById("duration_class").value,
    quality_bar:    document.getElementById("quality_bar").value,
    latency_mode:   document.getElementById("latency_mode").value,
    budget_mode:    document.getElementById("budget_mode").value,
    batch_size:     parseInt(document.getElementById("batch_size").value),
    simulation_mode: true,
  };
  if (jc) payload.job_budget_cap = parseFloat(jc);
  if (wc) payload.workspace_budget_cap = parseFloat(wc);

  if (mode === "v2") {
    payload.variant_count = parseInt(document.getElementById("variant_count").value) || 1;
    if (mm)  payload.markup_mode = mm;
    if (ptc) payload.price_to_customer = parseFloat(ptc);
    if (tmp) payload.target_margin_percent = parseFloat(tmp);
  }

  const endpoint = mode === "v2"
    ? `${API}/api/economics/v2/simulate`
    : `${API}/api/video-economics/simulate`;

  try {
    const resp = await fetch(endpoint, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    renderResults(data);
  } catch(e) {
    document.getElementById("results").innerHTML = `
      <div class="blocked-msg">
        ⚠️ Cannot connect to API at ${API}.<br/>
        Make sure the server is running: <code>uvicorn main:app --reload</code>
      </div>`;
  } finally {
    document.getElementById("loading").style.display = "none";
    btn.disabled = false;
    btn.textContent = "▶ Run Estimate";
  }
}

function badge(s) {
  const cls = (s || "safe").replace(/\./g, "_");
  return `<span class="badge ${cls}">${(s||"safe").replace(/_/g," ")}</span>`;
}

function renderResults(data) {
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:12px;color:var(--muted)">
        Request: <code>${(data.request_id||"").slice(0,8)}...</code>
        ${data.job_fingerprint ? `| Fingerprint: <code>${data.job_fingerprint}</code>` : ""}
      </div>
      ${badge(data.request_status)}
    </div>`;

  if (data.request_status === "blocked" && data.blocked_reason) {
    html += `<div class="blocked-msg">🚫 <strong>Blocked.</strong><br/>${data.blocked_reason}</div>`;
  }

  if (data.recommended_route) {
    html += `<div class="section-label">✅ Recommended Route</div>`;
    html += renderRoute(data.recommended_route, true);
  }

  if (data.alternatives?.length) {
    html += `<div class="section-label">Alternatives</div>`;
    data.alternatives.forEach(r => { html += renderRoute(r, false); });
  }

  const blockedRoutes = data.blocked_routes?.length
    ? data.blocked_routes
    : (data.all_routes||[]).filter(r => r.budget_status?.includes("blocked"));

  if (blockedRoutes.length) {
    html += `<div class="section-label">Blocked Routes</div>`;
    blockedRoutes.forEach(r => { html += renderRoute(r, false, true); });
  }

  if (data.savings_delta_vs_next != null) {
    html += `<div class="info-box">💡 Savings vs next best route: <strong>$${data.savings_delta_vs_next.toFixed(4)}</strong></div>`;
  }

  if (data.fallback_exposure) {
    const fb = data.fallback_exposure;
    html += `<div class="info-box">
      <strong>Fallback Exposure:</strong>
      Retry $${fb.retry_cost?.toFixed(2)}
      ${fb.fallback_provider ? ` | Fallback to ${fb.fallback_provider}: $${fb.fallback_cost?.toFixed(2)}` : ""}
      | Worst-case: <strong>$${fb.total_worst_case?.toFixed(2)}</strong>
    </div>`;
  }

  if (data.margin_simulation) {
    const m = data.margin_simulation;
    html += `<div class="info-box">
      <strong>Margin:</strong> ${m.markup_mode}
      | Cost $${m.base_cost?.toFixed(2)}
      ${m.price_to_customer != null ? ` | Price $${parseFloat(m.price_to_customer).toFixed(2)}` : ""}
      ${m.gross_margin_percent != null ? ` | Margin <strong>${parseFloat(m.gross_margin_percent).toFixed(1)}%</strong>` : ""}
      ${m.is_margin_blocked ? " | <span style='color:var(--red);font-weight:600'>BLOCKED</span>" : ""}
    </div>`;
  }

  if (data.batch_recommendation?.batch_recommended) {
    const b = data.batch_recommendation;
    html += `<div class="info-box">
      💡 <strong>Batch savings:</strong> Async mode saves ${b.savings_percent}%
      ($${b.estimated_savings?.toFixed(2)}) via ${b.recommended_provider}.
    </div>`;
  }

  document.getElementById("results").innerHTML = html;
}

function renderRoute(r, isRec, isBlocked=false) {
  const provider = r.provider || r.provider_key;
  const base  = r.estimated_base_cost;
  const low   = r.estimated_low_cost;
  const high  = r.estimated_high_cost;
  const score = r.final_score;

  let componentsHtml = "";
  if (r.cost_components?.length) {
    componentsHtml = `
      <table class="components-table">
        <thead><tr><th>Unit Type</th><th>Qty</th><th>Rate</th><th>Base</th><th>Low</th><th>High</th></tr></thead>
        <tbody>
          ${r.cost_components.map(c=>`
            <tr>
              <td>${c.unit_type}</td>
              <td>${c.unit_quantity}</td>
              <td>$${c.unit_rate?.toFixed(6)}</td>
              <td>$${c.base_cost?.toFixed(4)}</td>
              <td>$${c.low_cost?.toFixed(4)}</td>
              <td>$${c.high_cost?.toFixed(4)}</td>
            </tr>`).join("")}
        </tbody>
      </table>`;
  }

  return `<div class="route-card ${isRec ? "rec" : ""}">
    <div class="route-header">
      <span class="route-name">🔹 ${provider}</span>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        ${r.is_async_batch ? '<span class="meta-chip">async/batch</span>' : ""}
        ${badge(r.budget_status)}
        ${isRec ? '<span class="badge completed">RECOMMENDED</span>' : ""}
      </div>
    </div>
    <div class="cost-row">
      <div class="cost-item"><div class="val">$${base?.toFixed(2)}</div><div class="lbl">Base</div></div>
      <div class="cost-item"><div class="val" style="color:var(--green)">$${low?.toFixed(2)}</div><div class="lbl">Low</div></div>
      <div class="cost-item"><div class="val" style="color:var(--red)">$${high?.toFixed(2)}</div><div class="lbl">High</div></div>
      ${score != null ? `<div class="cost-item"><div class="val" style="color:var(--muted)">${(score*100).toFixed(0)}</div><div class="lbl">Score</div></div>` : ""}
      ${r.per_output_cost != null ? `<div class="cost-item"><div class="val" style="font-size:14px">$${r.per_output_cost?.toFixed(4)}</div><div class="lbl">Per output</div></div>` : ""}
    </div>
    <div style="margin-bottom:6px">
      <span class="meta-chip">cost: ${r.cost_class}</span>
      <span class="meta-chip">confidence: ${r.confidence_class}</span>
      ${r.async_savings_percent != null ? `<span class="meta-chip">saves ${r.async_savings_percent}% vs sync</span>` : ""}
      ${r.retry_exposure != null ? `<span class="meta-chip">retry exp: $${r.retry_exposure?.toFixed(3)}</span>` : ""}
    </div>
    <div class="explanation">${r.explanation}</div>
    ${componentsHtml}
  </div>`;
}

function loadPreset(name) {
  const presets = {
    cheap:   {use_case:"article_to_social", duration_class:"short", quality_bar:"acceptable", latency_mode:"async_ok", budget_mode:"cheapest", batch_size:5, job_budget_cap:10, workspace_budget_cap:500},
    breach:  {use_case:"campaign_variant_generation", duration_class:"long", quality_bar:"premium", latency_mode:"async_ok", budget_mode:"cheapest", batch_size:20, job_budget_cap:5, workspace_budget_cap:500},
    premium: {use_case:"brand_marketing_post_to_promo", duration_class:"medium", quality_bar:"premium", latency_mode:"fastest", budget_mode:"premium", batch_size:1, job_budget_cap:50, workspace_budget_cap:500},
    margin:  {use_case:"script_to_social_variants", duration_class:"short", quality_bar:"high", latency_mode:"async_ok", budget_mode:"balanced", batch_size:10, job_budget_cap:25, workspace_budget_cap:500},
  };
  const p = presets[name];
  if (!p) return;
  Object.entries(p).forEach(([k,v]) => { const el = document.getElementById(k); if(el) el.value = v; });
  if (name === "margin") {
    setMode("v2");
    document.getElementById("markup_mode").value = "markup";
    document.getElementById("price_to_customer").value = 60;
    document.getElementById("target_margin_percent").value = 40;
  }
}
</script>
</body>
</html>
